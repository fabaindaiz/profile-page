<div class="d-flex flex-column align-items-center text-center vw-90 mx-auto">
  <h1 class="page-title mb-5"><span class="fw-bold">Fabian's</span> Blog</h1>
  <div class="d-flex vw-90 flex-column align-items-center flex-md-row flex-md-wrap justify-content-md-center">
    @for (post of posts; track post.slug) {
      <div class="card post-card m-3">
        <div class="card-img-top bg-dark">
          <app-icon name="fa-regular-newspaper" class="icon-4x m-5 text-white"></app-icon>
        </div>
        <div class="card-body d-flex flex-column">
          <h2 class="h5 card-title post-title" [title]="post.title">{{post.title}}</h2>
          <p class="card-text post-description flex-grow-1">{{post.description}}</p>
          <a [routerLink]="'/blog/' + post.slug" class="btn btn-outline-dark align-self-center">
            <app-icon name="fa-regular-eye" class="icon-lg me-1"></app-icon>
            Read
          </a>
        </div>
      </div>
    }
  </div>
</div>
