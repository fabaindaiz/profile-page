<div class="d-flex min-vh-10 w-100 justify-content-center pb-3 pt-3 pe-4 ps-4 mt-5">
  @if (about$ | async; as about) {
    <a class="d-flex justify-content-start text-reset text-decoration-none" routerLink="/" aria-label="Home">
      <span class="h2 fw-bold">{{about.firstName}}</span>
      <span class="h2 fw-light">{{about.lastName}}</span>
    </a>
  }
  <div class="d-none d-md-flex flex-grow-1 justify-content-end align-items-start">
    Licenced under GPL-3.0
  </div>
</div>
