<div class="d-flex min-vh-10 w-100 justify-content-center pb-3 pt-3 pe-4 ps-4">
    <div class="d-flex justify-content-start" *ngIf="about$ | async as about" routerLink="/">
        <h2 class="fw-bold">{{about.firstName}}</h2>
        <h2 class="fw-light">{{about.lastName}}</h2>
    </div>
    <div class="d-none d-md-flex flex-grow-1 justify-content-end align-items-start">
        <button type="button" class="ms-2 me-2 btn btn-outline-dark border-0 fw-bold"
            *ngFor="let item of menuItems" [routerLink]="(isHome$ | async) ? item.homePath : item.pagePath"
            [fragment]="(isHome$ | async) ? item.fragment : ''">{{item.title}}</button>
    </div>
    <div class="d-flex d-md-none justify-content-end flex-grow-1">
        <div class="position-relative">
            <button type="button" class="btn btn-outline-dark border-0" aria-label="Menu" aria-controls="site-menu"
                [attr.aria-expanded]="menuOpen" (click)="menuOpen = !menuOpen">
                <app-icon name="fa-solid-bars" class="icon-lg"></app-icon>
            </button>
            <div id="site-menu" class="dropdown-menu show end-0 top-100" *ngIf="menuOpen">
                <button type="button" class="dropdown-item" *ngFor="let item of menuItems" (click)="menuOpen = false"
                    [routerLink]="(isHome$ | async) ? item.homePath : item.pagePath"
                    [fragment]="(isHome$ | async) ? item.fragment : ''">{{item.title}}</button>
            </div>
        </div>
    </div>
</div>
