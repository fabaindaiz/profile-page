@for (options of respOptions; track options) {
  <div [ngClass]="options.viewClasses"
    class="flex-column align-items-center text-center vw-90 mx-auto">
    <h1 [ngClass]="options.headingClass" class="mb-5"><span class="fw-bold">My</span> Links</h1>
    @if (socials$ | async; as socials) {
      <div class="d-flex vw-90 justify-content-center flex-wrap">
        @for (social of socials; track social) {
          <div class="social-icon ms-5 me-5 overlay"
            [ngStyle]="{ 'background-color': social.color.background }">
            <a href="{{social.sourceUrl}}" target="_blank" class="social-link">
              <app-icon [name]="social.iconClasses" [ngStyle]="{ 'color': social.color.icon }"></app-icon>
            </a>
          </div>
        }
      </div>
    }
  </div>
}
