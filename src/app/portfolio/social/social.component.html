<div class="d-flex flex-column align-items-center text-center vw-90 mx-auto">
  <h2 class="page-title mb-5"><span class="fw-bold">My</span> Links</h2>
  @if (socials$ | async; as socials) {
    <div class="d-flex vw-90 justify-content-center flex-wrap">
      @for (social of socials; track social.name) {
        <div class="social-icon ms-5 me-5 overlay" [ngStyle]="{ 'background-color': social.color.background }">
          <a [href]="social.sourceUrl" target="_blank" rel="noopener" class="social-link" [attr.aria-label]="social.name">
            <app-icon [name]="social.iconClasses" [ngStyle]="{ 'color': social.color.icon }"></app-icon>
          </a>
        </div>
      }
    </div>
  }
</div>
