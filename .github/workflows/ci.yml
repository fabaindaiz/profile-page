# Two jobs on every push and pull request: the gate (d-115f49-7161fe), which needs no install,
# and the built site (d-115f49-7d644b), which runs npm ci and installs Playwright's Chromium.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm run gate
      - name: One author per commit (d-115f49-cad445)
        run: |
          if git log --format=%B | grep -qiE '^(co-authored-by|claude-session):|generated with \[?claude code'; then
            echo "A commit carries an attribution line; commits have one author." >&2
            exit 1
          fi

  # The built site: tests, the prerendered build, every internal link and fragment in it, and the
  # request budget per page (AGENTS.md, Verification).
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
